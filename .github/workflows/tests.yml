name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

  # The same suite on Linux, so a Linux-only failure shows up on every push
  # instead of only when a release builds the Linux tarball. The system
  # libraries are the ones the release workflow's Linux toolchain image
  # installs (redactor-build-tools/linux-build/Dockerfile) for PyQt6's
  # bundled Qt; ffmpeg is there for the tests that run the real tool (they
  # skip when it is absent). fail-fast is off so one OS failing doesn't hide
  # the other's result.
  pytest-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libgl1 libegl1 libdbus-1-3 fontconfig ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q
